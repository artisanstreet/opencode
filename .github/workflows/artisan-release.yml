# Rebuilds each upstream OpenCode release with the patches in artisan/patches
# and publishes it as the GitHub release `artisan-v<version>`, which Artisan
# Forge installs from. Upstream's own workflows stay disabled in this fork.
name: artisan-release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream @opencode/cli version (default: the npm latest tag)"
        required: false
        type: string
      rebuild:
        description: "Replace an existing release of this version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency: artisan-release

env:
  # The targets Forge installs; names match upstream's `cli-<target>` outputs.
  TARGETS: linux-x64 linux-x64-musl linux-arm64 linux-arm64-musl darwin-arm64 darwin-x64 windows-x64 windows-arm64

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      latest: ${{ steps.plan.outputs.latest }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://registry.npmjs.org/-/package/@opencode%2fcli/dist-tags | jq -r .latest)
          version=${REQUESTED:-$latest}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unusable version $version"; exit 1; }
          build=true
          if gh release view "artisan-v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$REBUILD" != "true" ]; then
            build=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$([ "$version" = "$latest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "OpenCode $version (npm latest $latest), build=$build" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply the Artisan patches to upstream v${{ env.VERSION }}
        run: |
          set -euo pipefail
          cp -r artisan/patches "$RUNNER_TEMP/patches"
          git fetch --no-tags --depth=50 https://github.com/anomalyco/opencode.git "refs/tags/v$VERSION:refs/tags/v$VERSION"
          git checkout --detach "v$VERSION"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            am -3 "$RUNNER_TEMP"/patches/*.patch
          git log --oneline -n "$(( $(ls "$RUNNER_TEMP"/patches/*.patch | wc -l) + 1 ))"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build
        working-directory: packages/cli
        # Compile against the same Bun release upstream pins in package.json.
        run: BUN_COMPILE_RELEASE="bun-v$(bun --version)" ./script/build.ts
        env:
          OPENCODE_VERSION: ${{ env.VERSION }}
          OPENCODE_CHANNEL: latest
          GH_TOKEN: ${{ github.token }}

      - name: Tag the patched source
        run: |
          set -euo pipefail
          git tag -f "artisan-v$VERSION"
          git push -f origin "refs/tags/artisan-v$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: |
            packages/cli/dist/cli-*
            !packages/cli/dist/cli-*-baseline*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # Bun gives the darwin executables it cross-compiles an ad-hoc signature,
    # which is all Apple silicon needs for a download that isn't quarantined.
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: cli
          path: dist

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          platforms='{}'
          for target in $TARGETS; do
            source="dist/cli-$target"
            [ -d "$source" ] || { echo "missing build $target"; exit 1; }
            stage="$RUNNER_TEMP/stage-$target"
            rm -rf "$stage" && mkdir -p "$stage"
            cp -R "$source" "$stage/package"
            chmod +x "$stage"/package/bin/*
            # Forge reads this to know the build understands OPENCODE_HOME.
            jq -n --arg version "$VERSION" '{upstream: ("v" + $version), features: ["OPENCODE_HOME"]}' \
              > "$stage/package/artisan.json"
            asset="opencode-cli-$target.tar.gz"
            tar -czf "out/$asset" -C "$stage" package
            sha=$(sha256sum "out/$asset" | cut -d' ' -f1)
            size=$(stat -c%s "out/$asset")
            platforms=$(jq --arg t "$target" --arg a "$asset" --arg s "$sha" --argjson z "$size" \
              '. + {($t): {asset: $a, sha256: $s, size: $z}}' <<< "$platforms")
          done
          jq -n --arg version "$VERSION" --argjson platforms "$platforms" \
            '{version: $version, upstream: ("v" + $version), platforms: $platforms}' > out/manifest.json
          cat out/manifest.json

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          tag="artisan-v$VERSION"
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
          gh release create "$tag" -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "OpenCode $VERSION (Artisan)" \
            --notes "Upstream [v$VERSION](https://github.com/anomalyco/opencode/releases/tag/v$VERSION) with the patches in [artisan/patches](https://github.com/$GITHUB_REPOSITORY/tree/artisan-main/artisan/patches)." \
            --latest="$LATEST" \
            out/*
